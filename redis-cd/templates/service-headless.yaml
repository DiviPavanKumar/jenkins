apiVersion: v1
kind: Service
metadata:
  name: redis-headless-service
  namespace: roboshop
  labels:
    purpose: statefulset-redis
    project: roboshop
    environment: dev
spec:
  clusterIP: None  # Headless
  selector:
    purpose: statefulset-redis
    project: roboshop
    environment: dev
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017