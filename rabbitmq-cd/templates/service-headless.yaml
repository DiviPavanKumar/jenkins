apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless-service
  namespace: roboshop
  labels:
    purpose: statefulset-rabbitmq
    project: roboshop
    environment: dev
spec:
  clusterIP: None  # Headless
  selector:
    purpose: statefulset-rabbitmq
    project: roboshop
    environment: dev
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672