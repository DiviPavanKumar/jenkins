apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  serviceName: mysql-headless-service
  replicas: {{ .Values.statefulset.replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      purpose: statefulset-mysql
      project: roboshop
      environment: dev
  template:
    metadata:
      labels:
        purpose: statefulset-mysql
        project: roboshop
        environment: dev
    spec:
      serviceAccountName: roboshop-mysql-secret-reader
      terminationGracePeriodSeconds: 10
      volumes:
        - name: mysql-secret
          emptyDir: {}
      initContainers:
        - name: fetch-secret
          image: amazon/aws-cli
          command:
            - sh
            - -c
            - |
              aws secretsmanager get-secret-value \
                --secret-id roboshop/mysql/password \
                --query SecretString \
                --output text | jq -r .MYSQL_ROOT_PASSWORD > /run/secrets/mysql_root_password.txt
          volumeMounts:
            - name: mysql-secret
              mountPath: /run/secrets
      containers:
        - name: mysql
          image: "{{ .Values.statefulset.imageURL }}:{{ .Values.statefulset.imageVersion }}"
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              if [ -f /run/secrets/mysql_root_password.txt ]; then
                export MYSQL_ROOT_PASSWORD=$(cat /run/secrets/mysql_root_password.txt)
              else
                echo "❌ Password file not found!"
                exit 1
              fi
              exec /entrypoint.sh mysqld
          volumeMounts:
            - name: mysql-secret
              mountPath: /run/secrets
            - name: mysql-storage
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: roboshop-ebs-sc
        resources:
          requests:
            storage: 1Gi
